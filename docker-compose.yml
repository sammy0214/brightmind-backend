# Local development: one "region" = one API + one Postgres + one Redis.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: brightmind
      POSTGRES_PASSWORD: brightmind
      POSTGRES_DB: brightmind
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://brightmind:brightmind@db:5432/brightmind
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [db, redis]
    volumes: ["./data:/srv/data"]
volumes:
  pgdata:
